# Decap CMS configuration — Data 2 Decision website
# HOW PERMISSIONS WORK (read README.md for the full setup):
# - The comms team logs in with GitHub and can ONLY edit the six content
#   collections below (Features, Projects, Publications, Team, Development,
#   Student Lab).
# - They cannot touch site structure, design or settings: those files are not
#   exposed here, and branch protection + CODEOWNERS block them in GitHub.
# - Phone numbers are NOT collected anywhere on this site: the data files
#   are public, so a phone number stored here would not actually be hidden.
#   Keep phone numbers in the private tracker, never in the admin panel.
# - Every change goes through the editorial workflow: the team submits content
#   for review, and the admin (Naimul) approves it before it goes live.
#   Deleting an entry also creates a review request — nothing is deleted
#   without admin approval.

backend:
  name: github
  # TODO: replace with the real repo, e.g. naimul2026/d2d-website
  repo: naimulbhuiyan/d2d-website
  branch: main
  # Login runs on Vercel (free) — the Cloudflare account is locked, so the
  # Worker version in worker/auth.js is kept only as a backup.
  # Decap builds the login URL as base_url + "/" + auth_endpoint, so
  # base_url is just the host (no path) and auth_endpoint is just the path.
  # (A full URL in auth_endpoint gets wrongly stuck after api.netlify.com.)
  base_url: https://d2d-website-five.vercel.app
  auth_endpoint: api/auth

# Editorial workflow: all edits become pull requests for admin approval.
publish_mode: editorial_workflow

# Uploaded images land here and are served from the site.
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "features"
    label: "Features & News"
    label_singular: "Feature"
    files:
      - file: "data/features.json"
        label: "Features & News"
        name: "features"
        fields:
          - label: "Features"
            name: "items"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "Body", name: "body", widget: "text" }

  - name: "projects"
    label: "Projects"
    label_singular: "Project"
    files:
      - file: "data/projects.json"
        label: "Projects"
        name: "projects"
        fields:
          - label: "Projects"
            name: "items"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string", hint: "Tracker ID, e.g. T001" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Lead", name: "lead", widget: "string" }
              - { label: "Type", name: "type", widget: "select", options: ["Research", "Conference", "Funding", "Webinar"] }
              - { label: "Status", name: "status", widget: "select", options: ["In sprint", "Backlog", "Submitted", "Under review", "Published", "Parked", "Closed"] }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Details", name: "details", widget: "text", required: false, hint: "Longer detail shown when a visitor expands the project" }
              - { label: "Link", name: "link", widget: "string", required: false, hint: "The project's Drive folder URL, e.g. https://drive.google.com/drive/folders/..." }

  - name: "publications"
    label: "Submitted Publications"
    label_singular: "Publication"
    files:
      - file: "data/publications.json"
        label: "Submitted Publications"
        name: "publications"
        fields:
          - label: "Submitted Publications"
            name: "items"
            widget: "list"
            fields:
              - { label: "Topic", name: "topic", widget: "string" }
              - { label: "Detail", name: "detail", widget: "string", required: false }
              - { label: "Status", name: "status", widget: "select", options: ["Under review", "Published", "Rejected — needs revision", "Accepted"] }
              - { label: "Lead", name: "lead", widget: "string", required: false, hint: "Lead person, e.g. Naimul" }
              - { label: "Web link", name: "web", widget: "string", required: false, hint: "Where submitted — journal or conference website" }
              - { label: "Drive folder", name: "drive", widget: "string", required: false, hint: "Drive folder URL for the manuscript" }

  - name: "team"
    label: "Team"
    label_singular: "Team member"
    files:
      - file: "data/team.json"
        label: "Team"
        name: "team"
        fields:
          - label: "Team members"
            name: "items"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Photo", name: "photo", widget: "image", required: false, hint: "Square photo if available — otherwise initials are shown" }
              - { label: "Email", name: "email", widget: "string", required: false }
              - { label: "LinkedIn", name: "linkedin", widget: "string", required: false, hint: "Full profile URL, e.g. https://www.linkedin.com/in/..." }
              - { label: "Note", name: "note", widget: "text", required: false }

  - name: "development"
    label: "Development"
    label_singular: "Development item"
    files:
      - file: "data/development.json"
        label: "Development"
        name: "development"
        fields:
          - label: "Development items"
            name: "items"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Category", name: "tag", widget: "select", options: ["Data systems", "Data collection", "Tools", "Training", "Dashboards"] }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Lead", name: "lead", widget: "string", required: false }
              - { label: "Details", name: "details", widget: "text", required: false, hint: "Longer detail shown when a visitor expands the item" }
              - { label: "Link", name: "link", widget: "string", required: false, hint: "Optional link, e.g. a dashboard URL" }

  - name: "student-lab"
    label: "Student Lab"
    label_singular: "Student Lab entry"
    files:
      - file: "data/student-lab.json"
        label: "Student Lab"
        name: "student-lab"
        fields:
          - label: "BPH — Statistics Lab"
            name: "bph_statistics_lab"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Tag", name: "tag", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Details", name: "details", widget: "text", required: false }
              - { label: "Link", name: "link", widget: "string", required: false }
          - label: "MPH — Thesis"
            name: "mph_thesis"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Tag", name: "tag", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Details", name: "details", widget: "text", required: false }
              - { label: "Link", name: "link", widget: "string", required: false }
          - label: "MPH — Projects"
            name: "mph_projects"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Tag", name: "tag", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Details", name: "details", widget: "text", required: false }
              - { label: "Link", name: "link", widget: "string", required: false }
